<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LuxeStay — Мой Профиль</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .bg-overlay {
            background: linear-gradient(rgba(19, 27, 46, 0.85), rgba(19, 27, 46, 0.98)),
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop');
            background-size: cover; background-position: center; background-attachment: fixed;
        }
        header {
            background-color: #F8F4F0 !important; /* Тот самый бежевый хедер */
            z-index: 100;
        }
        .premium-shadow { box-shadow: 0 10px 40px -10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-overlay text-white min-h-screen">

<header class="border-b border-gray-200 sticky top-0 h-20">
    <div class="flex justify-between items-center w-full px-6 max-w-7xl mx-auto h-20">
        <div class="text-2xl font-extrabold tracking-tighter text-slate-900">LuxeStay</div>
        <nav class="hidden md:flex gap-10">
            <a href="rooms.html" class="text-sm font-bold text-slate-500 hover:text-slate-900 transition-colors">Номера</a>
            <a href="profile.html" class="text-sm font-bold text-slate-900 border-b-2 border-slate-900 pb-1">Бронирования</a>
        </nav>
        <div class="flex items-center gap-6">
            <span id="user-name-display" class="text-sm font-bold text-slate-800">Загрузка...</span>
            <button onclick="logout()" class="text-xs font-bold uppercase tracking-widest text-slate-500 hover:text-slate-900 transition-opacity">Выйти</button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto px-4 md:px-6 py-16">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-10">
        <!-- Сайдбар -->
        <aside class="md:col-span-3">
            <div class="p-8 bg-white/5 backdrop-blur-xl rounded-2xl border border-white/10 sticky top-28 text-center premium-shadow">
                <div class="w-20 h-20 bg-white/10 rounded-full flex items-center justify-center mx-auto mb-6 border border-white/20">
                    <span class="text-3xl">👤</span>
                </div>
                <h2 id="profile-name" class="text-xl font-bold mb-1">Загрузка...</h2>
                <p id="profile-email" class="text-sm text-gray-400 mb-8">Загрузка...</p>
                <div class="pt-6 border-t border-white/10">
                    <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-4 font-bold">Доступ в номер</p>
                    <button id="btn-generate-pass" onclick="generatePass()"
                            class="w-full bg-[#F8F4F0] text-slate-900 py-4 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-all hover:bg-white active:scale-95 shadow-lg mb-3">
                        Получить временный код
                    </button>
                    <div id="pass-display" class="mt-2 mb-4 font-mono text-3xl tracking-[0.4em] text-[#F8F4F0] font-extrabold hidden">0000</div>
                    
                    <p class="text-[10px] uppercase tracking-[0.2em] text-gray-500 mb-4 mt-6 font-bold">Настройки</p>
                    <button onclick="showChangePasswordModal()" class="w-full border border-white/20 text-white py-3 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-all hover:bg-white/10 active:scale-95 mb-3">
                        Сменить пароль
                    </button>
                    <button onclick="showAdminModal()" class="w-full border border-white/20 text-white py-3 rounded-xl font-bold text-[11px] uppercase tracking-widest transition-all hover:bg-white/10 active:scale-95">
                        Права администратора
                    </button>
                </div>
            </div>
        </aside>


        <div class="md:col-span-9">
            <div class="mb-12">
                <h1 class="text-5xl font-extrabold mb-4 tracking-tight">Мои бронирования</h1>
                <p class="text-gray-400 text-lg max-w-2xl">Ваши активные резервации и статусы номеров.</p>
            </div>
            <div id="bookings-container" class="space-y-8">
                <div id="booking-loader" class="flex flex-col items-center justify-center py-20 opacity-50">
                    <div class="animate-spin rounded-full h-12 w-12 border-4 border-[#F8F4F0] border-t-transparent mb-4"></div>
                    <p class="font-bold text-sm uppercase tracking-widest">Синхронизация с базой...</p>
                </div>
            </div>
        </div>
    </div>
</main>

<!-- Modals -->
<!-- Редактирование бронирования -->
<div id="edit-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-2xl transform transition-all duration-300 scale-100">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Редактирование</h2>
            <button onclick="hideEditModal()" class="text-gray-400 hover:text-slate-900 text-2xl font-light">&times;</button>
        </div>
        <div class="flex flex-col gap-5">
            <input type="hidden" id="edit-reservation-id">
            <input type="hidden" id="edit-room-id">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Дата заезда</label>
                <input type="date" id="edit-start-date" class="w-full p-4 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-slate-900/20 outline-none font-medium text-slate-900">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Дата выезда</label>
                <input type="date" id="edit-end-date" class="w-full p-4 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-slate-900/20 outline-none font-medium text-slate-900">
            </div>
            <button onclick="submitEditReservation()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-slate-800 transition-all active:scale-95 shadow-lg">
                Сохранить
            </button>
        </div>
    </div>
</div>


<div id="change-password-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-2xl transform transition-all duration-300 scale-100">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Смена пароля</h2>
            <button onclick="hideChangePasswordModal()" class="text-gray-400 hover:text-slate-900 text-2xl font-light">&times;</button>
        </div>
        <div class="flex flex-col gap-5">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Текущий пароль</label>
                <input type="password" id="old-password" class="w-full p-4 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-slate-900/20 outline-none font-medium text-slate-900">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Новый пароль</label>
                <input type="password" id="new-password" class="w-full p-4 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-slate-900/20 outline-none font-medium text-slate-900">
            </div>
            <button onclick="changePassword()" class="w-full bg-slate-900 text-white py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-slate-800 transition-all active:scale-95 shadow-lg">
                Сохранить
            </button>
        </div>
    </div>
</div>

<!-- Права администратора -->
<div id="admin-modal" class="hidden fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all duration-300">
    <div class="bg-white rounded-2xl max-w-sm w-full p-8 shadow-2xl transform transition-all duration-300 scale-100">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-slate-900">Доступ администратора</h2>
            <button onclick="hideAdminModal()" class="text-gray-400 hover:text-slate-900 text-2xl font-light">&times;</button>
        </div>
        <div class="flex flex-col gap-5">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Секретный ключ</label>
                <input type="text" id="admin-secret" class="w-full p-4 rounded-xl border border-gray-100 bg-gray-50 focus:bg-white focus:ring-2 focus:ring-slate-900/20 outline-none font-medium text-slate-900" placeholder="Введите ключ">
            </div>
            <button onclick="promoteToAdmin()" class="w-full bg-[#B38B3F] text-white py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:opacity-90 transition-all active:scale-95 shadow-lg">
                Подтвердить
            </button>
        </div>
    </div>
</div>


<script src="js/api.js"></script>
<script src="js/profile.js"></script>
</body>
</html>
