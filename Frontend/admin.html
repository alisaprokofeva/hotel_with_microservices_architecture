<!DOCTYPE html>
<html class="light" lang="ru">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>LuxeStay — Admin Panel</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;600;700&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">
        tailwind.config = {
            theme: {
                extend: {
                    "colors": {
                        "primary": "#0F172A",
                        "secondary": "#B38B3F",
                        "background": "#f1f5f9"
                    }
                }
            }
        }
    </script>
    <style>
        body { font-family: 'Manrope', sans-serif; }
        .bg-overlay {
            background: linear-gradient(rgba(19, 27, 46, 0.9), rgba(19, 27, 46, 0.98)),
                        url('https://images.unsplash.com/photo-1566073771259-6a8506099945?q=80&w=2070&auto=format&fit=crop');
            background-size: cover;
            background-position: center;
            background-attachment: fixed;
        }
        .premium-shadow { box-shadow: 0 20px 40px -10px rgba(0,0,0,0.3); }
    </style>
</head>
<body class="bg-overlay text-white min-h-screen flex flex-col">

<header class="bg-white/5 backdrop-blur-md border-b border-white/10 sticky top-0 z-40 h-20">
    <div class="flex justify-between items-center w-full px-8 max-w-7xl mx-auto h-20">
        <div class="text-2xl font-bold text-white tracking-tight">LuxeStay <span class="text-secondary text-sm ml-2">ADMIN</span></div>
        <div class="flex items-center gap-8">
            <nav class="flex gap-8">
                <a href="rooms.html" class="text-sm font-bold text-gray-400 uppercase tracking-widest hover:text-white transition-colors">Номера</a>
                <a href="profile.html" class="text-sm font-bold text-gray-400 uppercase tracking-widest hover:text-white transition-colors">Профиль</a>
            </nav>
            <div class="h-6 w-[1px] bg-white/20"></div>
            <button onclick="logout()" class="font-bold text-xs text-white uppercase tracking-widest hover:text-secondary transition-colors">Выйти</button>
        </div>
    </div>
</header>

<main class="max-w-7xl mx-auto w-full px-8 py-12 flex-grow">
    <div class="grid grid-cols-1 md:grid-cols-12 gap-12">
        <div class="md:col-span-8 space-y-8">
            <div class="flex justify-between items-end mb-8">
                <div>
                    <h1 class="text-4xl font-extrabold mb-2 tracking-tight">Управление номерами</h1>
                    <p class="text-gray-400 text-lg">Добавляйте или удаляйте номера.</p>
                </div>
                <button onclick="showAddRoomModal()" class="bg-white text-primary px-6 py-3 rounded-xl font-bold text-xs uppercase tracking-widest hover:bg-gray-200 transition-all shadow-lg">
                    + Добавить номер
                </button>
            </div>

            <div id="admin-rooms-container" class="space-y-4">
                <div id="admin-rooms-loader" class="text-center py-10 opacity-50">
                    <div class="animate-spin rounded-full h-8 w-8 border-2 border-white border-t-transparent mx-auto mb-2"></div>
                    <p class="text-xs uppercase tracking-widest">Загрузка...</p>
                </div>
            </div>
        </div>


        <div class="md:col-span-4">
            <div class="bg-white/5 border border-white/10 rounded-2xl p-8 premium-shadow sticky top-28">
                <h2 class="text-xl font-bold mb-6">Управление доступом</h2>
                <div class="space-y-4">
                    <div>
                        <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">ID Пользователя</label>
                        <input type="text" id="promote-user-id" class="w-full bg-white/10 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-secondary/50 placeholder-gray-500" placeholder="Например: 12">
                    </div>
                    <button onclick="promoteUser()" class="w-full bg-secondary text-white py-3 rounded-xl font-bold text-[11px] uppercase tracking-widest hover:opacity-90 transition-all shadow-lg">
                        Выдать права Admin
                    </button>
                </div>
            </div>
        </div>
    </div>
</main>


<div id="add-room-modal" class="hidden fixed inset-0 bg-black/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 transition-all">
    <div class="bg-primary border border-white/10 rounded-2xl max-w-md w-full p-8 shadow-2xl">
        <div class="flex justify-between items-center mb-6">
            <h2 class="text-2xl font-bold text-white">Новый номер</h2>
            <button onclick="hideAddRoomModal()" class="text-gray-400 hover:text-white text-2xl">&times;</button>
        </div>
        <div class="space-y-5">
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">Цена за ночь ($)</label>
                <input type="number" id="room-price" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-white/20" placeholder="150">
            </div>
            <div>
                <label class="block text-[10px] font-bold uppercase tracking-widest text-gray-400 mb-2">URL Изображений (через запятую)</label>
                <textarea id="room-images" rows="3" class="w-full bg-white/5 border border-white/10 rounded-xl px-4 py-3 text-white focus:outline-none focus:ring-2 focus:ring-white/20 placeholder-gray-600" placeholder="https://image1.jpg, https://image2.jpg"></textarea>
            </div>
            <button onclick="submitAddRoom()" class="w-full bg-white text-primary py-4 rounded-xl font-bold uppercase tracking-widest text-sm hover:bg-gray-200 transition-all mt-4">
                Создать
            </button>
        </div>
    </div>
</div>

<script src="js/api.js"></script>
<script src="js/admin.js"></script>
</body>
</html>
